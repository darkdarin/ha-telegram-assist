name: Release

# Push a tag v<version>: the manifest must say <version>, CHANGELOG.md must have a "## <version>"
# section; it becomes the notes of the GitHub release HACS offers as the update.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the version and extract the notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"$version\"" custom_components/telegram_assist/manifest.json \
            || { echo "::error file=custom_components/telegram_assist/manifest.json::version $version not found"; exit 1; }
          awk -v v="$version" '
            /^## / { if (found) exit; found = ($2 == v); next }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error file=CHANGELOG.md::no section for $version"; exit 1; }
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
