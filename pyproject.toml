[project]
name = "ha-telegram-assist-dev"
version = "0.0.0"
description = "Development environment for the Telegram Assist Home Assistant integration (not published)"
requires-python = ">=3.14.2"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    # Pinned to one Home Assistant release: 0.13.375 == homeassistant 2026.10.4.
    "pytest-homeassistant-custom-component==0.13.375",
    # Requirements of the components the tests set up (from their 2026.10.4 manifests).
    "gazetteer-matcher==1.1.0",
    "hassil==3.12.1",
    "home-assistant-intents==2026.10.6",
    "pymicro-vad==1.0.1",
    "pyspeex-noise==1.0.2",
    "mutagen==1.48.1",
    "ha-ffmpeg==3.2.2",
    "mypy>=1.18",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "BLE"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.mypy]
python_version = "3.14"
strict = true
follow_imports = "silent"
files = ["custom_components/telegram_assist", "tests"]

[[tool.mypy.overrides]]
module = ["pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true
follow_untyped_imports = true
